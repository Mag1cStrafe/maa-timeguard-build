name: Build MAA time guard (Windows x64)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-timeguard.yml'

permissions:
  contents: read

concurrency:
  group: maa-timeguard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch official MAA v6.18.0 source
        uses: actions/checkout@v7
        with:
          repository: MaaAssistantArknights/MaaAssistantArknights
          ref: v6.18.0
          path: upstream
          persist-credentials: false

      - name: Verify official source tree
        run: |
          $tree = git -C upstream rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $tree.Trim() -ne '23feeddc538de4e10646b692b0bb065efe77ccb3') { throw 'Official source tree mismatch' }

      - name: Materialize the reviewed patch and build helpers
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('build_package.py'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(''))"
          python -c "import base64,pathlib; p=pathlib.Path('timeguard.patch'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(''))"
          python -c "import base64,pathlib; p=pathlib.Path('time_window.cpp'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(''))"
          python -c "import base64,pathlib; p=pathlib.Path('time-tests/CMakeLists.txt'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(''))"

      - name: Apply only the time-check patch
        working-directory: upstream
        run: |
          git apply --check ../timeguard.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply ../timeguard.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace check failed' }

      - name: Fetch official required submodules
        working-directory: upstream
        shell: bash
        run: bash ./.github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils 3rdparty/EmulatorExtras

      - name: Fetch official pinned MaaDeps
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/maadeps-download.py x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'Dependency download failed' }

      - name: Compile and run Debug boundary tests
        run: |
          cmake -S time-tests -B time-tests-build -G 'Visual Studio 18 2026' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Time test configuration failed' }
          cmake --build time-tests-build --config Debug --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Time test compilation failed' }
          & ./time-tests-build/Debug/time_window.exe
          if ($LASTEXITCODE -ne 0) { throw 'Time boundary tests failed' }

      - name: Configure original core build
        working-directory: upstream
        run: |
          cmake --preset windows-x64 -DBUILD_WPF_GUI=OFF -DBUILD_DEBUG_DEMO=OFF -DBUILD_RESOURCE_UPDATER=OFF -DMAA_HASH_VERSION=v6.18.0-timeguard
          if ($LASTEXITCODE -ne 0) { throw 'Core configuration failed' }

      - name: Build Debug MaaCore and check resources without a device
        run: |
          cmake --build upstream/build --target MaaCore --config Debug --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Debug core compilation failed' }
          python build_package.py Debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug core loading check failed' }

      - name: Build production MaaCore and check DLL loading
        run: |
          cmake --build upstream/build --target MaaCore --config RelWithDebInfo --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Production core compilation failed' }
          python build_package.py RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { throw 'Production core loading check failed' }

      - name: Download matching official full package and assemble
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build_package.py download
          if ($LASTEXITCODE -ne 0) { throw 'Official package download failed' }
          python build_package.py package
          if ($LASTEXITCODE -ne 0) { throw 'Full package assembly failed' }

      - name: Upload full runnable package
        uses: actions/upload-artifact@v7
        with:
          name: MAA-v6.18.0-win-x64-timeguard
          path: dist/MAA-v6.18.0-win-x64-timeguard.zip
          if-no-files-found: error
          retention-days: 7
